name: Truco - teste visual mobile

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/web/src/mesa-mobile.css'
      - 'apps/web/src/polimento-v2.css'
      - 'apps/web/src/telas/Mesa.tsx'
      - 'apps/web/src/componentes/Placar.tsx'
      - 'apps/web/src/componentes/BarraAcoes.tsx'
      - 'apps/web/src/componentes/Overlays.tsx'
      - 'apps/web/e2e/layout-mobile.spec.ts'
      - '.github/workflows/mobile-layout.yml'

jobs:
  celular:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @truco/web exec playwright install chromium --with-deps
      - run: pnpm --filter @truco/web exec playwright test e2e/layout-mobile.spec.ts --project=celular
