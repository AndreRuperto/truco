name: Truco - testes e build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @truco/web build

  e2e:
    name: Playwright - partidas e reconexão (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @truco/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'
      - name: Guardar rastros em caso de falha
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
